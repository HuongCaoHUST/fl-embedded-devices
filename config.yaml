training:
  # true: `docker compose up` automatically submits one training run.
  # false: infrastructure starts only; submit manually when desired.
  auto_start: true

  # Flower waits for this many connected clients before starting round 1.
  minimum_clients: 3

  # Number of local YOLO epochs performed by each client in every FL round.
  local_epochs: 1

  # Number of federated aggregation rounds performed by the server.
  server_rounds: 2

  # Only these YOLO sections are exchanged and averaged with FedAvg.
  # Keeping all three is equivalent to standard full-model FedAvg.
  merge_parts:
    - backbone
    - neck
    - head

  # Allow the server and clients to open their APIs before app submission.
  startup_delay_seconds: 5
