[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embeddedexample"
version = "1.0.0"
description = "Federated AI with Embedded Devices using Flower"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.28.0,<2.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.3.0,<9.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
simulation = ["flwr[simulation]>=1.28.0,<2.0"]

[tool.hatch.build]
exclude = [
    "datasets/*", # Exclude datasets from FAB (if generated in this directory)
    "_static/*", # Exclude images in README from FAB
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "embeddedexample.server_app:app"
clientapp = "embeddedexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 2
fraction-train = 1.0
fraction-evaluate = 1.0
min-train-nodes = 2
min-evaluate-nodes = 2
min-available-nodes = 2
local-epochs = 1
learning-rate = 0.01
batch-size = 4
image-size = 320
# This checkpoint is the initial global model distributed to all clients.
# It can be an Ultralytics model name or a local .pt path.
pretrained-model = "yolo11n.pt"
dataset-config = "datasets/client_{partition_id}/data.yaml"
device = "auto"
output-path = "runs/fl/final_yolo11.pt"
# One row per client and round when validating the aggregated global model.
val-metrics-path = "runs/fl/val_metrics_by_node.csv"
